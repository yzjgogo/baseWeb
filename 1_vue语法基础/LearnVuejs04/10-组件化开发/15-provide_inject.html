<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<!--

  provide:给祖先使用，提供数据；
  inject:给后代使用，获取祖先提供您的数据，无论隔了多少层的后代都可以；

  provide和inject默认不是响应式的，解决办法：
  provide提供的是一个对象，inject接收的就是这个对象，后代组件可以直接修改这个对象的属性值，达到响应式的效果，因为对象是引用类型，后代组件修改的是同一个对象的属性值
  eg:
  provide() {
  return {
    // 这样传递整个对象，子组件修改或读取对象内的属性时是响应式的
    userInfo: this.userInfo 
  }
}
  如果想在后代中修改祖先的数据，祖先提供的是一个方法，后代接收这个方法，后代调用这个方法修改祖先的数据
  eg:
  provide() {
  return {
    userInfo: this.userInfo,
    updateName: (newName) => {
      this.userInfo.name = newName;
    }
  }
}
  -->
<div id="app">
  <cpn></cpn>
</div>



<template id="cpn">
  <div>
    <div @click="getInject" style="background-color: #2eaae0;width: 100px;height: 50px">获取注入的东西</div>
  </div>
</template>

<script src="../js/vue.js"></script>
<script>
  const cpn = {
    template: '#cpn',
    data() {
      return {}
    },
    methods: {
      getInject(){
        console.log("getInject输出注入的foo：",this.foo)
      }
    },
    inject:['foo'],
    created(){
      console.log("输出注入的foo--：",this.foo,typeof this.foo)
      // console.log(this.foo())
      // let mFoo = this.foo()
      // console.log("执行了foo：",typeof mFoo)
    }
  }

  const app = new Vue({
    el: '#app',
    data: {
      message: '你好啊',
    },
    props: {
      monkey: {
        type: Object,
        default() {
          return {name:'孙悟空'}
        }
      },
    },
    computed:{
      price(){
        return 10086
      }
    },
    components: {
      cpn
    },
    method:{
      doPrint(){
        console.log("执行doPrint")
        return "返回值"
      }
    },
    /**
      一、provide可以是对象，但是无法注入父组件的data，计算属性，属性值，因此不建议这种方法
     * */
    // provide:{
      //可以
      // foo:'bar'

      //不可以注入父组件的data，计算属性和属性
      // foo:this.message
      // foo:this.price
      // foo:this.monkey

      //注入的是整个方法,子组件接收这个方法可以执行
      // foo:()=>{
      //   return {name:"郭德纲",age:18}
      // }

      //不可以注入父组件的函数
      // foo:()=>this.doPrint
    // }

    /**
      二、1，provide可以是函数，但是这个函数必须返回一个对象
     这种方式本质上和‘一’一样，无法注入父组件的data，计算属性，属性值，因此不建议这种方法
     * */
    // provide:()=>{
    //     // return {foo:'barr'}
    //     // return {foo:this.message}
    //     // return {foo:this.price}
    //     return {foo:this.monkey}
    // }

    /**
       二、2，函数的另一个写法，以后都用这种方法，可以注入父组件的data，计算属性，属性值
     * */
    provide(){
      // return {foo:this.message}
      // return {foo:this.price}
      return {foo:this.monkey}
    }
  })
</script>

</body>
</html>

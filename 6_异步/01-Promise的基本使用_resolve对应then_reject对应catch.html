<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>

<script>

  /**
   https://developer.mozilla.org/zh-CN/docs/Learn/JavaScript/Asynchronous/Promises
   * */

  // 1.使用setTimeout
  // setTimeout(() => {
  //   console.log('Hello World');
  // }, 1000)

  // 什么情况下会用到Promise?
  // 一般情况下是有异步操作时,使用Promise对这个异步操作进行封装
  // 在执行传入的回调函数时, 会传入两个参数, resolve, reject.本身又是函数

  //20260127很重要的补充:一旦执行new Promise(),这个Promise就进入pending状态，相当于一直等着不往下执行，直到resolve()或者reject()被调用，Promise才会进入fulfilled状态或者rejected状态，然后才会去执行then()或者catch()里面的回调函数。
  new Promise((resolve, reject) => {
    //模拟网络请求，请求成功执行resolve()，请求失败执行reject()
    setTimeout(() => {
      // 1_1成功的时候调用resolve
      resolve('Hello World')

      // 2_1失败的时候调用reject
      // reject('error message')
    }, 1000)
  }).then((data) => {
    // 1_2前面执行了resolve()，这里才会执行then()
    console.log(data);//Hello World
    console.log(data);
    console.log(data);
    console.log(data);
    console.log(data);
  }).catch((err) => {
    // 2_2前面执行了reject()，这里才会执行catch()
    console.log(err);//error message
  })
</script>
</body>
</html>
